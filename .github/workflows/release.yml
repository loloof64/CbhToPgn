name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev \
            binutils coreutils desktop-file-utils fakeroot fuse \
            libgdk-pixbuf2.0-dev patchelf python3-pip python3-setuptools \
            squashfs-tools strace util-linux zsync

      - name: Install appimage-builder
        run: sudo pip3 install appimage-builder

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Assemble AppDir
        run: |
          set -e
          rm -rf AppDir
          cp -r build/linux/x64/release/bundle AppDir
          mkdir -p AppDir/usr/share/icons/hicolor/512x512/apps/
          cp web/icons/Icon-512.png AppDir/usr/share/icons/hicolor/512x512/apps/cbh_to_pgn.png

      - name: Write AppImageBuilder recipe
        run: |
          cat > AppImageBuilder.yml << EOF
          version: 1

          AppDir:
            path: ./AppDir
            app_info:
              id: com.loloof64.cbh_to_pgn
              name: cbh_to_pgn
              icon: cbh_to_pgn
              version: ${GITHUB_REF_NAME}
              exec: cbh_to_pgn
              exec_args: \$@
            apt:
              arch: amd64
              allow_unauthenticated: true
              sources:
              - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
              - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
              - sourceline: deb http://archive.ubuntu.com/ubuntu/ jammy-backports main restricted universe multiverse
              - sourceline: deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
              include:
              - libgtk-3-0
              exclude:
              - humanity-icon-theme
              - hicolor-icon-theme
              - adwaita-icon-theme
              - ubuntu-mono
            files:
              exclude:
              - usr/share/man
              - usr/share/doc/*/README.*
              - usr/share/doc/*/changelog.*
              - usr/share/doc/*/NEWS.*
              - usr/share/doc/*/TODO.*

          AppImage:
            arch: x86_64
            update-information: None
            sign-key: None
          EOF

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          appimage-builder --recipe AppImageBuilder.yml --skip-test
          built="$(ls cbh_to_pgn-*.AppImage)"
          target="cbh_to_pgn-${GITHUB_REF_NAME}-x86_64.AppImage"
          if [ "$built" != "$target" ]; then mv "$built" "$target"; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: cbh_to_pgn-*-x86_64.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Zip release bundle
        shell: pwsh
        run: |
          $zipName = "cbh_to_pgn-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath $zipName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: cbh_to_pgn-*-windows.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_message.md
          files: |
            dist/cbh_to_pgn-*-x86_64.AppImage
            dist/cbh_to_pgn-*-windows.zip
